<!DOCTYPE html>

        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- tailwind + daisyui cdn -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font-family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

        rel="stylesheet">

    <!-- css link -->
    <link rel="stylesheet" href="./style.css">

<body>
    <!-- Navbar -->
    <header>
        <div class="navbar bg-base-100 shadow-sm">
            <div class="navbar-start">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">

                    </ul>
                </div>
                <div class="ml-10">
                    <a href="" class="flex items-center gap-1`">
                        <span class="text-lg fornt-bold">English</span>
                        <img src="./resources/assets/logo.png" alt="" />
                        <span class="font-bangla text-lg font-semibold">জানালা</span>
                    </a>
                </div>
            </div>

            <div class="navbar-end">
                <ul class="menu menu-horizontal px-1 space-x-4 mr-10">
                    <li>
                        <a href="" class="btn btn-outline btn-primary"><i
                                class="fa-solid fa-circle-question"></i>FAQ</a>
                    </li>
                    <li>
                        <a href="" class="btn btn-outline btn-primary"><i class="fa-solid fa-book-open"></i>Learn</a>
                    </li>
                    <li>
                        <a href="" class="btn btn-outline btn-primary"><i
                                class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <!-- section start -->
    <section class="flex flex-col-reverse md:flex-row items-center justify-between gap-10 px-10 w-11/12 py-5">
        <div class="content flex-1 text-center md:text-left">
            <h2 class="text-4xl font-bold mb-8">
                <span class="text-sky-500">English</span> is Easy!!
            </h2>
            <p class="font-bangla text-2xl">আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার
                দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>
            <form>
                <input type="name" placeholder="Enter your name" class="input input-bordered w-full max-w-xs mt-5" />
                <input type="password" placeholder="..........................."
                    class="input input-bordered w-full max-w-xs mt-5" />
                <br>
                <input type="submit" value="Get Started"
                    class="btn btn-primary md:w-[115px] w-full max-w-xs mt-5 cursor-pointer" />
                <!-- <button class="btn btn-primary w-[115]  max-w-xs mt-5">Get Started</button> -->
            </form>
        </div>
        <div class="image flex-1">
            <img src="./resources/assets/hero-student.png" alt="English Learning">
        </div>

    </section>
    <!-- section end -->
